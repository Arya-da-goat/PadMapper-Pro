name: Extract PadMapper ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi
          echo "ZIP found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          # Copy the extracted project into the repository root.
          cp -r extracted/* . 2>/dev/null || true
          cp -r extracted/.[!.]* . 2>/dev/null || true

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract PadMapper project"
          git push
